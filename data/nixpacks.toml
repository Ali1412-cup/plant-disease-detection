[phases.setup]
nixPkgs = ["python310"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install torch==2.1.0+cpu torchvision==0.16.0+cpu --find-links https://download.pytorch.org/whl/cpu/torch_stable.html",
  "pip install fastapi uvicorn timm Pillow python-multipart numpy"
]

[start]
cmd = "uvicorn app:app --host 0.0.0.0 --port $PORT"
